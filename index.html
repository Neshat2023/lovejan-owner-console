<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<meta name="referrer" content="no-referrer" />
<title>LoveJan — Owner Console</title>
<style>
  :root{
    --bg:#0b0910; --panel:#141019; --panel2:#1c1726; --panel3:#241d31; --line:#2a2438;
    --txt:#f4f1f8; --mut:#a49cb6; --dim:#6f6883;
    --pink:#ff3b6b; --purple:#8b5cf6; --blue:#60a5fa;
    --good:#34d399; --warn:#fbbf24; --bad:#fb7185; --r:14px;
    --grad:linear-gradient(135deg,var(--pink),var(--purple));
  }
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{background:
      radial-gradient(1100px 560px at 100% -12%,rgba(139,92,246,.16),transparent),
      radial-gradient(900px 480px at -10% 112%,rgba(255,59,107,.12),transparent),var(--bg);
    color:var(--txt);
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased}
  button{font:inherit;cursor:pointer;border:0} a{color:var(--pink)}
  .hidden{display:none!important}
  .num{font-variant-numeric:tabular-nums}
  ::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#2a2438;border-radius:8px}

  /* Login */
  #login{min-height:100vh;display:grid;place-items:center;padding:24px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
  .login-card{width:400px;max-width:100%;padding:34px}
  .brand{display:flex;align-items:center;gap:11px;font-size:22px;font-weight:800;letter-spacing:-.01em}
  .dot{width:30px;height:30px;border-radius:9px;background:var(--grad);box-shadow:0 6px 20px rgba(255,59,107,.35)}
  .sub{color:var(--mut);margin:6px 0 22px}
  label{display:block;font-size:12px;color:var(--mut);margin:14px 0 6px;font-weight:600}
  input,select,textarea{width:100%;padding:11px 12px;background:var(--panel2);border:1px solid var(--line);
        border-radius:10px;color:var(--txt);outline:none;font:inherit}
  textarea{resize:vertical;min-height:76px}
  input:focus,select:focus,textarea:focus{border-color:var(--purple)}
  .btn{padding:11px 14px;border-radius:10px;color:#fff;font-weight:700;background:var(--grad)}
  .btn.block{width:100%;margin-top:16px}
  .btn.sm{padding:7px 11px;font-weight:600;font-size:13px;border-radius:9px}
  .btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--txt)}
  .btn.danger{background:linear-gradient(135deg,#f43f5e,#b91c1c)}
  .btn.good{background:linear-gradient(135deg,#10b981,#059669)}
  .btn:disabled{opacity:.5;cursor:default}
  .linkbtn{background:none;color:var(--mut);font-size:13px;margin-top:14px;text-decoration:underline}
  .err{color:var(--bad);margin-top:12px;min-height:18px;font-size:13px}
  .ok{color:var(--good)}
  .seg{display:flex;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:4px;margin-bottom:6px}
  .seg button{flex:1;background:none;color:var(--mut);border-radius:7px;padding:8px;font-weight:600}
  .seg button.on{background:var(--panel3);color:var(--txt)}

  /* Shell */
  #app{display:grid;grid-template-columns:238px 1fr;min-height:100vh}
  aside{background:linear-gradient(180deg,var(--panel),#100c17);border-right:1px solid var(--line);
    padding:20px 14px;display:flex;flex-direction:column;gap:3px;position:sticky;top:0;height:100vh}
  aside .brand{font-size:18px;padding:4px 8px 16px}
  nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--mut);
        text-decoration:none;font-weight:600;font-size:14px}
  nav a .ic{width:18px;text-align:center;opacity:.9}
  nav a.active{background:var(--panel3);color:var(--txt)} nav a:hover{background:var(--panel2);color:var(--txt)}
  nav a .badge{margin-left:auto;font-size:11px;font-weight:800;background:var(--pink);color:#fff;border-radius:999px;padding:1px 7px}
  .spacer{flex:1}
  main{padding:24px 30px 60px;overflow:auto}
  .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;gap:12px;flex-wrap:wrap}
  h1{font-size:24px;margin:0;letter-spacing:-.02em}
  h2{font-size:12px;color:var(--dim);margin:28px 0 12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
  .pill{font-size:12px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);color:var(--mut);font-weight:600}
  .pill.on{color:var(--good);border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.08)}
  .pill.off{color:var(--warn);border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.07)}

  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(158px,1fr))}
  .kpi{padding:16px 18px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);position:relative;overflow:hidden}
  .kpi .v{font-size:30px;font-weight:800;letter-spacing:-.03em}
  .kpi .l{color:var(--mut);font-size:12px;margin-top:3px;font-weight:500}
  .kpi .d{font-size:11px;margin-top:6px;font-weight:700}
  .kpi .d.up{color:var(--good)} .kpi .d.down{color:var(--bad)}
  .kpi.accent{background:linear-gradient(135deg,rgba(255,59,107,.15),rgba(139,92,246,.13));border-color:rgba(139,92,246,.32)}
  .cols{display:grid;gap:16px;grid-template-columns:1fr 1fr}
  .cols.c3{grid-template-columns:1fr 1fr 1fr}
  @media(max-width:1000px){.cols,.cols.c3{grid-template-columns:1fr}}
  .panel{padding:18px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line)}
  .panel h3{margin:0 0 4px;font-size:15px} .panel .cap{color:var(--mut);font-size:12px;margin:0 0 12px}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);font-size:13px}
  th{color:var(--dim);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
  tbody tr:hover{background:var(--panel2)}
  .clk{cursor:pointer}
  .tag{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:700;white-space:nowrap}
  .tag.susp{background:rgba(251,113,133,.16);color:var(--bad)} .tag.prem{background:rgba(139,92,246,.2);color:#c4b5fd}
  .tag.ok{background:rgba(52,211,153,.14);color:var(--good)} .tag.ver{background:rgba(96,165,250,.18);color:#93c5fd}
  .row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  .field{margin-bottom:12px} .muted{color:var(--mut)} .dim{color:var(--dim)}
  .toast{position:fixed;right:20px;bottom:20px;background:var(--panel3);border:1px solid var(--line);
    padding:12px 16px;border-radius:12px;opacity:0;transform:translateY(8px);transition:.2s;max-width:360px;z-index:60;box-shadow:0 10px 40px rgba(0,0,0,.4)}
  .toast.show{opacity:1;transform:none}
  .switch{position:relative;width:48px;height:27px;flex:none}
  .switch input{display:none}
  .switch span{position:absolute;inset:0;background:var(--panel2);border:1px solid var(--line);border-radius:999px;transition:.2s}
  .switch span::after{content:"";position:absolute;width:21px;height:21px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s}
  .switch input:checked + span{background:var(--grad)} .switch input:checked + span::after{left:24px}

  /* Drawer */
  .scrim{position:fixed;inset:0;background:rgba(4,2,8,.6);backdrop-filter:blur(2px);z-index:40;opacity:0;pointer-events:none;transition:.2s}
  .scrim.show{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100vh;width:min(560px,96vw);background:var(--panel);border-left:1px solid var(--line);
    z-index:50;transform:translateX(100%);transition:.24s cubic-bezier(.2,.7,.2,1);overflow:auto;padding:22px 24px}
  .drawer.show{transform:none}
  .photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
  .photo{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:3/4;background:var(--panel2);border:1px solid var(--line)}
  .photo img{width:100%;height:100%;object-fit:cover;display:block}
  .photo .del{position:absolute;top:5px;right:5px;background:rgba(0,0,0,.6);border-radius:8px;padding:4px 7px;font-size:11px;color:#fff;font-weight:700;cursor:pointer}
  /* Photo Review grid */
  .preview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:16px}
  .pcell{display:flex;flex-direction:column;gap:6px}
  .pcap{font-size:12px;line-height:1.3}
  .pcap .pname{font-weight:700;cursor:pointer}
  .pcap .pname:hover{color:var(--pink)}
  .msg{padding:9px 12px;border-radius:12px;margin:6px 0;max-width:80%;font-size:13px;position:relative}
  .msg .who{font-size:11px;color:var(--dim);margin-bottom:2px}
  .msg .x{position:absolute;top:4px;right:6px;color:var(--bad);font-size:11px;cursor:pointer;opacity:.6}
  .msg:hover .x{opacity:1}
  .statline{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0}
  .stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:78px}
  .stat .n{font-size:19px;font-weight:800} .stat .k{font-size:11px;color:var(--mut)}
  svg .grid-l{stroke:var(--line);stroke-width:1}
  .lgd{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:8px}
  .lgd i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
</style>
</head>
<body>
  <!-- LOGIN -->
  <div id="login">
    <div class="card login-card">
      <div class="brand"><div class="dot"></div> LoveJan</div>
      <p class="sub">Owner console</p>

      <div id="paneOtp">

  <div id="app" class="hidden">

        <a data-view="overview" class="active"><span class="ic">📊</span> Overview</a>
        <a data-view="growth"><span class="ic">📈</span> Growth</a>
        <a data-view="engagement"><span class="ic">⚡</span> Engagement</a>

        <a data-view="photos"><span class="ic">📷</span> Photo Review</a>

    <main>
      <div class="head">
        <h1 id="title">Overview</h1>
        <div class="row">
          <span id="monPill" class="pill"></span>

  <div class="scrim" id="scrim"></div>
  <div class="drawer" id="drawer"></div>
  <div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = "https://ipynejgeycjyczmuisbj.supabase.co";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlweW5lamdleWNqeWN6bXVpc2JqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2MzkxNjIsImV4cCI6MjA5NzIxNTE2Mn0._N5Xzi6nCC7o3IFOkNB2TkFJSszvOaszCWmX3GOFybg";
const $ = s=>document.querySelector(s);
const el = (h)=>{const t=document.createElement("template");t.innerHTML=h.trim();return t.content.firstChild;};
const esc = s=> (s??"").toString().replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const view = $("#view");
let session = JSON.parse(localStorage.getItem("lj_admin_session")||"null");
// Magic-link arrival: Supabase redirects back here with #access_token=…&refresh_token=… in the
// URL hash. Adopt those as our session, strip them from the URL, and flag boot() to promote+enter
// via gate() (a first-time owner isn't in `admins` yet, so a plain am_i_admin check would fail).
let magicArrived = false;
try{
  const h = new URLSearchParams((location.hash||"").replace(/^#/,""));
  const at = h.get("access_token"), rt = h.get("refresh_token");
  if(at && rt){
    session = {access_token:at, refresh_token:rt, email:session?.email||null};
    localStorage.setItem("lj_admin_session", JSON.stringify(session));
    magicArrived = true;
    history.replaceState(null,"",location.pathname+location.search);
  }
}catch(e){}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2800);}

// ---------- raw-fetch API (no SDK/CDN — maximum stability) ----------
function saveSession(d){ session={access_token:d.access_token,refresh_token:d.refresh_token,email:d.user?.email||session?.email}; localStorage.setItem("lj_admin_session",JSON.stringify(session)); }
async function authHeaders(){ return {apikey:ANON,"Content-Type":"application/json",Authorization:"Bearer "+(session?.access_token||"")}; }
async function refreshToken(){
  if(!session?.refresh_token) return false;
  const r = await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:ANON,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:session.refresh_token})});
  if(!r.ok){ return false; } saveSession(await r.json()); return true;
}
async function call(path, opts, retry=true){
  const res = await fetch(SUPABASE_URL+path, {...opts, headers:{...(await authHeaders()),...(opts.headers||{})}});
  if(res.status===401 && retry && await refreshToken()) return call(path,opts,false);
  return res;
}
async function rpc(fn, params={}){
  const res = await call("/rest/v1/rpc/"+fn,{method:"POST",body:JSON.stringify(params)});
  const txt = await res.text(); let d=null; try{d=txt?JSON.parse(txt):null;}catch{d=txt;}
  if(!res.ok) throw new Error((d&&d.message)||("HTTP "+res.status));
  return d;
}
async function tget(q){ const res=await call("/rest/v1/"+q,{method:"GET"}); const d=await res.json(); if(!res.ok) throw new Error(d.message||"HTTP "+res.status); return d; }
async function edge(name, body){ const res=await call("/functions/v1/"+name,{method:"POST",body:JSON.stringify(body)}); const d=await res.json().catch(()=>({})); if(!res.ok) throw new Error(d.error||("HTTP "+res.status)); return d; }

// Resize + recompress a picked image to a JPEG under ~1MB (the previews bucket cap) entirely
// in the browser, so admin photo uploads always fit both buckets. Returns base64 (no prefix).
function fileToJpegB64(file, maxDim=1600, maxBytes=980000){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{ try{
      let w=img.naturalWidth, h=img.naturalHeight;
      if(!w||!h){ reject(new Error("unreadable image")); return; }
      if(Math.max(w,h)>maxDim){ const s=maxDim/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s); }
      const c=document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      let q=0.9, url=c.toDataURL("image/jpeg",q);
      while(url.length*0.75>maxBytes && q>0.35){ q-=0.1; url=c.toDataURL("image/jpeg",q); }
      URL.revokeObjectURL(img.src);
      resolve(url.split(",")[1]);
    }catch(e){ reject(e); } };
    img.onerror=()=>reject(new Error("could not load image"));
    img.src=URL.createObjectURL(file);
  });
}

// ---------- auth ----------
$("#tabOtp").onclick=()=>{$("#tabOtp").classList.add("on");$("#tabPw").classList.remove("on");$("#paneOtp").classList.remove("hidden");$("#panePw").classList.add("hidden");};
$("#tabPw").onclick=()=>{$("#tabPw").classList.add("on");$("#tabOtp").classList.remove("on");$("#panePw").classList.remove("hidden");$("#paneOtp").classList.add("hidden");};
$("#otpBtn").onclick=async()=>{
  $("#loginErr").textContent="";
  const email=$("#otpEmail").value.trim();
  try{
    const r=await fetch(SUPABASE_URL+"/auth/v1/otp",{method:"POST",headers:{apikey:ANON,"Content-Type":"application/json"},body:JSON.stringify({email,create_user:true})});
    if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.msg||e.error_description||("HTTP "+r.status));}
    $("#otpBtn").disabled=true;$("#otpBtn").textContent="Link sent ✓";
    $("#loginErr").innerHTML="<span class='ok'>Sign-in link sent to "+esc(email)+" — open your email and click the link. It'll bring you right back here, signed in.</span>";
  }catch(e){$("#loginErr").textContent=e.message;}
};
$("#pwBtn").onclick=async()=>{
  $("#loginErr").textContent="";
  try{
    const r=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:ANON,"Content-Type":"application/json"},body:JSON.stringify({email:$("#pwEmail").value.trim(),password:$("#pwPass").value})});
    const d=await r.json(); if(!r.ok) throw new Error(d.msg||d.error_description||"Sign-in failed");
    saveSession(d); await gate();
  }catch(e){$("#loginErr").textContent=e.message;}
};
$("#signout").onclick=()=>{ localStorage.removeItem("lj_admin_session"); session=null; location.reload(); };

// Promote owner (by email) then verify admin, then enter.
async function gate(){
  try{ await rpc("bootstrap_owner"); }catch{}
  let isAdmin=false; try{ isAdmin = await rpc("am_i_admin")===true; }catch{}
  if(!isAdmin){ $("#loginErr").textContent="This account isn't an owner/admin."; localStorage.removeItem("lj_admin_session"); session=null; return; }
  $("#whoami").textContent=session?.email||"admin";
  $("#login").classList.add("hidden"); $("#app").classList.remove("hidden"); route("overview");
}

// ---------- SVG charts (self-contained) ----------
function fmt(n){ n=+n||0; return n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e3?(n/1e3).toFixed(1)+"k":(""+Math.round(n)); }
function areaChart(data, color="#ff3b6b", h=210){
  const W=600,pad={l:34,r:10,t:12,b:22},n=data.length;
  const ys=data.map(d=>+d.y||0),maxY=Math.max(1,...ys);
  const X=i=> pad.l+(n<=1?0:i/(n-1))*(W-pad.l-pad.r);
  const Y=v=> h-pad.b-(v/maxY)*(h-pad.t-pad.b);
  let line="",area="";
  data.forEach((d,i)=>{const x=X(i),y=Y(+d.y||0);line+=(i?"L":"M")+x.toFixed(1)+" "+y.toFixed(1)+" ";});
  area=line+`L ${X(n-1).toFixed(1)} ${h-pad.b} L ${X(0).toFixed(1)} ${h-pad.b} Z`;
  let grid="";for(let g=0;g<=3;g++){const gy=pad.t+g/3*(h-pad.t-pad.b);grid+=`<line class="grid-l" x1="${pad.l}" y1="${gy}" x2="${W-pad.r}" y2="${gy}"/>`;
    grid+=`<text x="4" y="${gy+3}" fill="#6f6883" font-size="10">${fmt(maxY*(1-g/3))}</text>`;}
  const step=Math.max(1,Math.floor(n/6));let lbl="";
  data.forEach((d,i)=>{if(i%step===0||i===n-1)lbl+=`<text x="${X(i)}" y="${h-6}" fill="#6f6883" font-size="9" text-anchor="middle">${esc((d.x||"").slice(5))}</text>`;});
  const last=data[n-1]||{y:0};
  return `<svg viewBox="0 0 ${W} ${h}" style="width:100%;height:auto" preserveAspectRatio="none">
    <defs><linearGradient id="g${color.slice(1)}" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="${color}" stop-opacity=".33"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    ${grid}<path d="${area}" fill="url(#g${color.slice(1)})"/><path d="${line}" fill="none" stroke="${color}" stroke-width="2.2"/>
    <circle cx="${X(n-1)}" cy="${Y(+last.y||0)}" r="3.4" fill="${color}"/>${lbl}</svg>`;
}
function barsH(data, color="#8b5cf6"){
  const max=Math.max(1,...data.map(d=>+d.value||0));
  return `<div style="display:flex;flex-direction:column;gap:9px">${data.map(d=>`
    <div class="row" style="gap:10px"><div style="width:120px;font-size:12px" class="muted">${esc(d.label)}</div>
      <div style="flex:1;background:var(--panel2);border-radius:6px;overflow:hidden;height:16px">
        <div style="height:100%;width:${(+d.value/max*100).toFixed(1)}%;background:${color};border-radius:6px"></div></div>
      <div class="num" style="width:52px;text-align:right;font-weight:700">${fmt(d.value)}</div></div>`).join("")}</div>`;
}
function donut(data){
  const colors=["#ff3b6b","#8b5cf6","#34d399","#fbbf24","#60a5fa","#f472b6","#a78bfa","#fb7185","#22d3ee","#f59e0b"];
  const total=Math.max(1,data.reduce((s,d)=>s+(+d.value||0),0));let a=-Math.PI/2,seg="";
  data.forEach((d,i)=>{const frac=(+d.value||0)/total,a2=a+frac*2*Math.PI,x1=60+42*Math.cos(a),y1=60+42*Math.sin(a),x2=60+42*Math.cos(a2),y2=60+42*Math.sin(a2),large=frac>.5?1:0;
    seg+=`<path d="M ${x1.toFixed(1)} ${y1.toFixed(1)} A 42 42 0 ${large} 1 ${x2.toFixed(1)} ${y2.toFixed(1)}" fill="none" stroke="${colors[i%colors.length]}" stroke-width="16"/>`;a=a2;});
  const lgd=data.map((d,i)=>`<span><i style="background:${colors[i%colors.length]}"></i>${esc(d.label)} <b class="num">${fmt(d.value)}</b></span>`).join("");
  return `<div class="row" style="gap:16px"><svg viewBox="0 0 120 120" width="120" height="120">${seg}</svg><div class="lgd" style="flex-direction:column;gap:6px">${lgd}</div></div>`;
}

// ---------- Health strip ----------
// The whole backend is fail-closed and silent, which is right for users and blinding for the
// owner: push reached ZERO people for weeks and nothing anywhere said so. This is the other
// half of failing closed — failing closed AND saying so, on the first screen.
function healthStrip(h){
  if(!h||!h.checks) return "";
  const bad = h.checks.filter(c=>c.status!=="ok");
  if(!bad.length) return `<div class="panel" style="border-color:#2c6"><b class="good">All systems nominal.</b>
    <span class="muted" style="font-size:12px"> ${h.checks.length} checks passed.</span></div>`;
  return `<div class="panel" style="border-color:${bad.some(c=>c.status==='alert')?'#a33':'#a83'}">
    <b class="${bad.some(c=>c.status==='alert')?'err':''}">${bad.filter(c=>c.status==='alert').length} alert(s), ${bad.filter(c=>c.status==='warn').length} warning(s)</b>
    <table style="margin-top:8px"><tbody>
    ${bad.map(c=>`<tr>
      <td style="width:78px"><span class="pill ${c.status==='alert'?'off':'on'}">${c.status.toUpperCase()}</span></td>
      <td><b>${esc(c.label)}</b> — <span class="num">${esc(String(c.value??'—'))}</span>

}

// ---------- Verification review ----------
// This screen exists because the queue behind it had no reader. verify-identity started routing
// "this doesn't look like the same person" cases into manual_verification_requests, and
// request_manual_verification() had been writing rows since July — but nothing could list them
// and nothing could resolve them, so eight people sat waiting, the oldest for eleven days.
//
// The judgement being made here is "is this the same human?", so the photos have to be ON the
// screen. A table of user ids cannot answer that question, and an owner who cannot answer it
// will simply not use the queue.
function verifyReview(){ withLoad(async()=>{
  const rows=await rpc("admin_verification_queue")||[];
  if(!rows.length){ view.innerHTML="<div class='panel'><p class='dim'>Nobody is waiting. 🎉</p></div>"; return; }
  view.innerHTML=`<div class="panel">
    <p class="cap">${rows.length} waiting · oldest first · approving restores the blue badge immediately.</p>
    <div id="vqueue"></div>
  </div>`;
  const q=$("#vqueue");
  for(const r of rows){
    const days=Math.floor((Date.now()-new Date(r.requested_at))/86400000);
    const el=document.createElement("div");
    el.className="panel"; el.style.margin="10px 0";
    el.innerHTML=`
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap">
        <div><b class="pname" data-open="${esc(r.user_id)}" style="cursor:pointer">${esc(r.display_name||"—")}</b>
          <span class="dim" style="font-size:12px"> · waiting ${days} day${days===1?"":"s"}</span></div>
        <div class="dim" style="font-size:12px">
          ${r.reason?`flagged: <b>${esc(r.reason)}</b> · `:""}last attempt: ${esc(r.last_outcome||"none")}${r.last_similarity!=null?` (${r.last_similarity}%)`:""} · ${r.photo_count} photo${r.photo_count===1?"":"s"}
        </div>
      </div>
      <p class="${r.reason==="identity_changed"?"err":"dim"}" style="font-size:12px;margin:6px 0">
        <b>Why they're stuck:</b> ${esc(r.blocker||"unknown")} — ${esc(r.recommendation||"")}</p>
      <div class="preview-grid vphotos" style="margin-top:8px"><span class="dim">loading photos…</span></div>
      <div style="margin-top:10px;display:flex;gap:8px;align-items:center">
        ${r.can_approve
          ? `<button class="btn ok" data-approve="${esc(r.request_id)}">Approve — restore badge</button>`
          : `<button class="btn" disabled title="They have no main photo, so the badge would attest to nothing.">Approve — unavailable</button>`}
        <button class="btn danger" data-reject="${esc(r.request_id)}">Reject</button>
      </div>`;
    q.appendChild(el);
    // Photos load per-row so one slow fetch never blanks the whole queue.
    edge("admin-media",{action:"list",user_id:r.user_id}).then(({photos})=>{
      const box=el.querySelector(".vphotos");
      box.innerHTML=(photos&&photos.length)
        ? photos.map(p=>`<div class="pcell"><div class="photo">${p.url?`<img src="${esc(p.url)}" loading="lazy"/>`:`<div class="dim">no preview</div>`}</div></div>`).join("")
        : `<span class="dim">No photos on this account — that alone is usually why they failed.</span>`;
    }).catch(()=>{ el.querySelector(".vphotos").innerHTML="<span class='dim'>Couldn't load photos.</span>"; });
  }
  q.querySelectorAll(".pname[data-open]").forEach(t=>t.onclick=()=>openUser(t.dataset.open));
  const decide=async(id,approve)=>{
    if(!approve && !confirm("Reject this person? Their badge stays off — they can try again from the app."))return;
    try{ await rpc("admin_resolve_verification",{p_request:id,p_approve:approve});
         toast(approve?"Approved — badge restored":"Rejected"); verifyReview(); }
    catch(e){ toast(e.message); }
  };
  q.querySelectorAll("[data-approve]").forEach(b=>b.onclick=()=>decide(b.dataset.approve,true));
  q.querySelectorAll("[data-reject]").forEach(b=>b.onclick=()=>decide(b.dataset.reject,false));
}); }

    try{ const data_b64=await fileToJpegB64(f); await edge("admin-media",{action:"upload",user_id:id,data_b64}); toast("Photo added"); openUser(id); }
    catch(err){ toast(err.message||"Upload failed"); btn.disabled=false; btn.textContent=label; }
  };
  // photos
  try{
    const {photos}=await edge("admin-media",{action:"list",user_id:id});

  }catch(e){ $("#dPhotos").innerHTML="<p class='err'>"+esc(e.message)+"</p>"; }
  // conversations
  try{
    const convos=await rpc("admin_user_conversations",{p_user:id});
    $("#dConvos").innerHTML = convos.length? convos.map(cv=>`<div class="row clk" data-conv="${cv.match_id}" style="justify-content:space-between;padding:9px 4px;border-bottom:1px solid var(--line)">

// ---------- Discovery pool ----------
// "Why does the deck feel empty?" has two completely different answers — the app is broken,
// or most accounts simply cannot be shown — and nothing in the console could tell them apart.
// This names the FIRST failing condition per person, so "14 have no photos" becomes a to-do
// list. It also shows the city split, which is the real story: a healthy-looking pool spread
// across twenty cities is still an empty deck for every single person in it.
function discovery(){ withLoad(async()=>{
  const rows = await rpc("admin_discovery_pool");
  const corr = await rpc("admin_corridor").catch(()=>null);
  const inPool = rows.filter(r=>r.discoverable);
  const out    = rows.filter(r=>!r.discoverable);
  const byReason = {}; out.forEach(r=>byReason[r.reason]=(byReason[r.reason]||0)+1);
  const byCity   = {};
  inPool.forEach(r=>{ const c=r.city||"(no city)"; byCity[c]=(byCity[c]||0)+1; });
  const cities = Object.entries(byCity).sort((a,b)=>b[1]-a[1]);
  const biggest = cities[0] ? cities[0][1] : 0;

  view.innerHTML=`
    ${corr?`<div class="panel" style="border-color:#2c6">
      <h2 style="margin-top:0">Tehrangeles corridor · LA + Orange County</h2>
      <p class="muted" style="margin:0 0 10px">The one market we are concentrating on. LA→Irvine is 56km,
      inside the 80km default radius, so everyone here can already see everyone else.
      <b>Share of pool is the number to move</b> — the rest is vanity.</p>
      <div class="grid">
        <div class="kpi accent"><div class="v num">${fmt(corr.total)}</div><div class="l">People in corridor</div></div>
        <div class="kpi"><div class="v num">${corr.share_of_pool}%</div><div class="l">Share of whole pool</div></div>
        <div class="kpi"><div class="v num">${fmt(corr.women)} / ${fmt(corr.men)}</div><div class="l">Women / Men</div></div>
        <div class="kpi"><div class="v num">${fmt(corr.joined_7d)}</div><div class="l">Joined last 7 days</div></div>
        <div class="kpi"><div class="v num">${fmt(corr.verified)}</div><div class="l">Verified here</div></div>
      </div>
      <p class="muted" style="font-size:12px;margin-top:8px">Cities: ${(corr.cities||[]).map(esc).join(" · ")||"—"}</p>
    </div>`:""}
    <div class="grid">
      <div class="kpi accent"><div class="v num">${fmt(inPool.length)}</div><div class="l">In the Discover pool</div></div>
      <div class="kpi"><div class="v num">${fmt(out.length)}</div><div class="l">Cannot be shown</div></div>
      <div class="kpi"><div class="v num">${fmt(cities.length)}</div><div class="l">Cities they're spread across</div></div>
      <div class="kpi ${biggest<10?'':''}"><div class="v num">${fmt(biggest)}</div><div class="l">Biggest single city</div></div>
    </div>

    ${biggest < 10 ? `<div class="panel" style="border-color:#a83">
      <b>The pool is real; the geography is the problem.</b>
      <p class="muted" style="margin:6px 0 0">${inPool.length} people spread across ${cities.length} cities means the
      largest local deck anyone can see is about ${biggest}. No amount of app work fixes this — it is
      solved by concentrating signups in ONE metro until it reaches critical mass.</p></div>` : ""}

    <div class="panel">
      <h2 style="margin-top:0">Where they are</h2>
      <table><thead><tr><th>City</th><th>People in pool</th></tr></thead><tbody>
      ${cities.map(([c,n])=>`<tr><td>${esc(c)}</td><td class="num">${n}</td></tr>`).join("")}
      </tbody></table>
    </div>

    <div class="panel">
      <h2 style="margin-top:0">Why ${out.length} can't be shown</h2>
      <table><thead><tr><th>Reason</th><th>People</th></tr></thead><tbody>
      ${Object.entries(byReason).sort((a,b)=>b[1]-a[1])
        .map(([r,n])=>`<tr><td>${esc(r)}</td><td class="num">${n}</td></tr>`).join("")}
      </tbody></table>
    </div>

    <div class="panel">
      <h2 style="margin-top:0">Everyone, newest activity first</h2>
      <table><thead><tr><th>Name</th><th>City</th><th>Photos</th><th>Verified</th><th>Status</th></tr></thead><tbody>
      ${rows.map(r=>`<tr>
        <td>${esc(r.display_name||"(no name)")}</td>
        <td class="muted">${esc(r.city||"—")}</td>
        <td class="num">${r.photos}</td>
        <td>${r.verified?"✓":""}</td>
        <td>${r.discoverable?'<span class="pill on">in pool</span>'
                            :'<span class="pill off">'+esc(r.reason)+'</span>'}</td>
      </tr>`).join("")}
      </tbody></table>
    </div>`;
});}

// ---------- Notifications ----------
// Send to ONE user or broadcast. Every path is gated server-side by app.is_admin(); this page
// only composes. Broadcast is deliberately awkward: you must Preview (dry run) before Send is
// enabled, and Send asks again — the unrecoverable mistake here is messaging everyone twice.
let NPICK=null;            // {id,name} selected recipient, null = broadcast
function notify(){ withLoad(async()=>{
  const a=await rpc("admin_push_audience");
  const hist=await rpc("admin_push_history",{p_limit:15});
  // With 0 device tokens nothing can arrive no matter what we send — say so loudly rather than
  // letting the owner send into the void and conclude push is broken.
  const deadAudience = (a.with_token||0)===0;
  view.innerHTML=`
    ${deadAudience?`<div class="panel" style="border-color:#a33">
      <b class="err">No device can receive a push yet — 0 registered tokens.</b>
      <p class="muted" style="margin:6px 0 0">The live App Store build (116) shipped without the
      <code>aps-environment</code> entitlement, so iOS never issues a token. The entitlement is in
      the source now; this fills in as users install build 117+. Sending before then is a no-op.</p>
    </div>`:""}
    <div class="grid">
      <div class="kpi"><div class="v num">${fmt(a.users_total)}</div><div class="l">Users</div></div>
      <div class="kpi"><div class="v num">${fmt(a.with_token)}</div><div class="l">Reachable (has token)</div></div>
      <div class="kpi"><div class="v num">${fmt(a.opted_in)}</div><div class="l">Opted in to news</div></div>
      <div class="kpi accent"><div class="v num">${fmt(a.broadcast_reach)}</div><div class="l">Broadcast reach</div></div>
      <div class="kpi"><div class="v num">${fmt(a.queued)}</div><div class="l">Queued in outbox</div></div>
    </div>

    <div class="panel">
      <h2 style="margin-top:0">Compose</h2>
      <div class="seg" style="margin-bottom:10px">
        <button id="nmOne">One person</button><button id="nmAll" class="on">Everyone (opted in)</button>
      </div>
      <div id="nOneBox" style="display:none;margin-bottom:10px">
        <div class="row"><input id="nq" placeholder="Search name or email…" style="flex:1">
          <button class="btn sm" id="nsearch">Search</button></div>
        <div id="nres" class="muted" style="margin-top:6px"></div>
      </div>
      <input id="ntitle" maxlength="120" placeholder="Title — e.g. New in LoveJan 1.1.1">
      <div class="muted" style="font-size:11px;margin:2px 0 8px" id="ntitlec"></div>
      <textarea id="nbody" maxlength="400" rows="3" placeholder="Body — what's actually new, in one honest sentence."></textarea>
      <div class="muted" style="font-size:11px;margin:2px 0 10px" id="nbodyc"></div>

      <div class="panel" style="background:var(--panel3);padding:12px">
        <div class="muted" style="font-size:11px;margin-bottom:6px">iPhone preview</div>
        <div style="background:#1c1c1e;border-radius:14px;padding:10px 12px;max-width:360px">
          <div style="font-size:11px;color:#8e8e93">LOVEJAN · now</div>
          <div style="font-weight:700;color:#fff" id="pvT">Title</div>
          <div style="color:#d1d1d6;font-size:13px" id="pvB">Body</div>
        </div>
      </div>

      <div class="row" style="margin-top:12px">
        <button class="btn ghost" id="ndry">Preview reach (sends nothing)</button>
        <button class="btn" id="nsend" disabled>Send</button>
      </div>
      <p class="muted" style="font-size:12px;margin-top:8px" id="nout">
        Broadcast reaches only people who opted in to news (App Store rule 4.5.4). One-person sends
        are support messages and ignore that toggle. Cooldown between broadcasts: 60 min.</p>
    </div>

    <div class="panel">
      <h2 style="margin-top:0">Recent sends</h2>
      <table><thead><tr><th>When</th><th>To</th><th>Title</th><th>Reached</th></tr></thead><tbody>
      ${hist.length?hist.map(h=>`<tr>
        <td class="muted">${new Date(h.created_at).toLocaleString()}</td>
        <td>${h.audience==="broadcast"?"Everyone":esc(h.target_name||"—")}${h.dry_run?' <span class="muted">(preview)</span>':""}</td>
        <td>${esc(h.title)}</td><td class="num">${fmt(h.recipients)}</td></tr>`).join("")
        :`<tr><td colspan="4" class="muted">Nothing sent yet.</td></tr>`}
      </tbody></table>
    </div>`;

  const T=$("#ntitle"), B=$("#nbody");
  const sync=()=>{ $("#pvT").textContent=T.value||"Title"; $("#pvB").textContent=B.value||"Body";
    $("#ntitlec").textContent=T.value.length+"/120"; $("#nbodyc").textContent=B.value.length+"/400";
    $("#nsend").disabled=true; };   // any edit invalidates the previous preview
  T.oninput=sync; B.oninput=sync; sync();

  const setMode=(one)=>{ NPICK=null; $("#nOneBox").style.display=one?"":"none";
    $("#nmOne").classList.toggle("on",one); $("#nmAll").classList.toggle("on",!one);
    $("#nres").textContent=""; $("#nsend").disabled=true; };
  $("#nmOne").onclick=()=>setMode(true); $("#nmAll").onclick=()=>setMode(false);

  $("#nsearch").onclick=async()=>{
    const q=$("#nq").value.trim(); if(!q) return;
    const rows=await rpc("admin_search_users",{p_q:q});
    $("#nres").innerHTML=rows.length?rows.slice(0,8).map(u=>
      `<button class="btn ghost sm" data-uid="${u.id}" data-nm="${esc(u.display_name||u.email||u.id)}"
        style="margin:3px 4px 0 0">${esc(u.display_name||"(no name)")} <span class="muted">${esc(u.email||"")}</span></button>`
    ).join(""):"<span class='muted'>No match.</span>";
    $("#nres").querySelectorAll("button[data-uid]").forEach(b=>b.onclick=()=>{
      NPICK={id:b.dataset.uid,name:b.dataset.nm};
      $("#nres").innerHTML=`Sending to <b>${esc(NPICK.name)}</b>`; $("#nsend").disabled=true;
    });
  };

  const args=(dry)=>({p_title:T.value,p_body:B.value,p_user_id:NPICK?NPICK.id:null,p_dry_run:dry});
  $("#ndry").onclick=async()=>{
    try{
      const r=await rpc("admin_send_push",args(true));
      $("#nout").innerHTML=`Preview: this would reach <b>${fmt(r.recipients)}</b> ${r.audience==="broadcast"?"people":"device owner"}. Nothing was sent.`;
      $("#nsend").disabled = r.recipients===0;
      if(r.recipients===0) $("#nout").innerHTML+=" <span class='err'>Nobody to send to — Send stays disabled.</span>";
    }catch(e){ $("#nout").innerHTML=`<span class="err">${esc(explainPush(e.message))}</span>`; }
  };
  $("#nsend").onclick=async()=>{
    const who=NPICK?NPICK.name:"EVERYONE who opted in";
    if(!confirm(`Send "${T.value}" to ${who}?\n\nThis cannot be undone once APNs accepts it.`)) return;
    $("#nsend").disabled=true;
    try{
      const r=await rpc("admin_send_push",args(false));
      $("#nout").innerHTML=`<b class="good">Sent.</b> ${fmt(r.recipients)} recipient(s), delivery: ${r.delivery}.`+
        (r.delivery==="queued"?" Queued sends drain via the outbox sweeper (~5 min).":"");
      setTimeout(()=>route("notify"),1200);
    }catch(e){ $("#nout").innerHTML=`<span class="err">${esc(explainPush(e.message))}</span>`; $("#nsend").disabled=false; }
  };
});}
// Turn the frozen server error tokens into something a human can act on.
function explainPush(m){
  if(/BROADCAST_TOO_SOON/.test(m))   return "Too soon — there's a 60-minute cooldown between broadcasts (Config: admin_broadcast_min_interval_minutes).";
  if(/BROADCAST_TOO_LARGE/.test(m))  return "Audience is larger than the safety cap (Config: admin_broadcast_max_recipients).";
  if(/PUSH_TITLE_REQUIRED/.test(m))  return "Title can't be empty.";
  if(/PUSH_BODY_REQUIRED/.test(m))   return "Body can't be empty.";
  if(/PUSH_TITLE_TOO_LONG/.test(m))  return "Title is over 120 characters.";
  if(/PUSH_BODY_TOO_LONG/.test(m))   return "Body is over 400 characters.";
  if(/admin only/.test(m))           return "You're not an admin on this account.";
  return m;
}

<template id="jvTpl">

    </div>

<script>
(function(){
"use strict";

// This fragment is a guest inside index.html and depends on its globals.
if (typeof rpc !== "function" || typeof edge !== "function" || typeof route !== "function") {
  console.error("[jarvis-tab] paste this AFTER index.html's main <script>; host helpers missing.");
  return;
}

// ---- backend contract (none of it deployed yet — see banner at top of file) ----
const JV_FN       = "jarvis-tools";              // TODO: supabase/functions/jarvis-tools/
const JV_RPC_TASK = "jarvis_list_tasks";         // TODO: migration 0126+
const JV_RPC_APPR = "jarvis_pending_approvals";  // TODO: migration 0126+

// ---- chrome strings. Content is NEVER translated; only the UI furniture. ----
const STR = {
  en:{
    sub:"Ask about production. Every answer carries its evidence.",
    readonly:"READ-ONLY",
    readonlyTip:"Phase B ships no mutating tools — Jarvis can read production and answer, it cannot change anything. This mode is fixed and cannot be switched off.",
    send:"Send",
    placeholder:"Ask Jarvis…   Enter to send · Shift+Enter for a new line",
    you:"You", bot:"Jarvis", sys:"System",
    empty:"Nothing asked yet.",
    evidence:"Evidence",
    stripIdle:"No tool has run yet.",
    stripRun:"Working — the tool names itself when it reports.",
    stripErr:"Tool unavailable",
    lblSource:"source", lblObserved:"observed at", lblEnv:"environment",
    tasks:"Tasks", thId:"id", thStatus:"status", thCreated:"created at", thLang:"language",
    tasksNone:"No tasks.",
    approvals:"Pending approvals", approvalsNone:"None pending.",
    unavailable:"not deployed or unreachable — ",
    noAnswer:"The tool returned no data. Open Evidence to see exactly what came back.",
    noTool:"I have no read-only tool for that. Phase B answers system health, invariants, the verification and moderation queues, funnels, growth signals and headline metrics — nothing else. I will not guess.",
    notDeployed:"The Jarvis backend is not installed on this project yet.",
    bannerTail:"Until these are deployed this tab can show its chrome but cannot answer anything."
  },
  fa:{
    sub:"درباره‌ی production بپرسید. هر پاسخ شواهد خودش را همراه دارد.",
    readonly:"فقط خواندنی",
    readonlyTip:"در فاز B هیچ ابزار تغییردهنده‌ای وجود ندارد — جارویس فقط می‌تواند production را بخواند و پاسخ دهد، نمی‌تواند چیزی را تغییر دهد. این حالت ثابت است و قابل خاموش کردن نیست.",
    send:"ارسال",
    placeholder:"از جارویس بپرسید…   Enter برای ارسال · Shift+Enter برای خط تازه",
    you:"شما", bot:"جارویس", sys:"سیستم",
    empty:"هنوز چیزی پرسیده نشده است.",
    evidence:"شواهد",
    stripIdle:"هنوز هیچ ابزاری اجرا نشده است.",
    stripRun:"در حال کار — ابزار هنگام گزارش، نام خودش را اعلام می‌کند.",
    stripErr:"ابزار در دسترس نیست",
    lblSource:"منبع", lblObserved:"زمان مشاهده", lblEnv:"محیط",
    tasks:"کارها", thId:"شناسه", thStatus:"وضعیت", thCreated:"زمان ایجاد", thLang:"زبان",
    tasksNone:"کاری وجود ندارد.",
    approvals:"تأییدهای در انتظار", approvalsNone:"چیزی در انتظار نیست.",
    unavailable:"مستقر نشده یا در دسترس نیست — ",
    noAnswer:"ابزار هیچ داده‌ای برنگرداند. برای دیدن دقیقاً آنچه بازگشته، شواهد را باز کنید.",
    noTool:"برای این درخواست ابزار read-only ندارم. فاز B فقط به سلامت سیستم، invariant ها، صف تأیید و بازبینی عکس، قیف‌ها، سیگنال‌های رشد و آمار کلی جواب می‌دهد. حدس نمی‌زنم.",
    notDeployed:"بک‌اند جارویس هنوز روی این پروژه نصب نشده است.",
    bannerTail:"تا زمانی که این‌ها مستقر نشوند، این تب فقط ظاهرش را نشان می‌دهد و نمی‌تواند به چیزی پاسخ دهد."
  }
};
let JV_LANG = localStorage.getItem("lj_jarvis_lang") === "fa" ? "fa" : "en";
const S = k => (STR[JV_LANG] && STR[JV_LANG][k]) || STR.en[k] || k;

// ---- bidi ------------------------------------------------------------------
// Persian/Arabic script blocks. Latin letters are counted separately so that a
// Persian sentence quoting an identifier ("build 116", "admin_metrics") stays
// RTL, while an English sentence quoting one Persian word does not flip.
const FA = "\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFE";
const ZW = "\u200C\u200D";   // ZWNJ/ZWJ — invisible, so written as escapes, never literals
const FA_LETTER = new RegExp("[" + FA + "]", "g");
// One run = Persian words plus the spaces/punctuation that sit between them.
const FA_RUN = new RegExp(
  "[" + FA + ZW + "]+(?:[ \t\u00A0\u060C\u061B\u061F!?.\-]+[" + FA + ZW + "]+)*", "g");

function jvScript(s){
  s = String(s == null ? "" : s);
  const fa = (s.match(FA_LETTER) || []).length;
  const en = (s.match(/[A-Za-z]/g) || []).length;
  if (!fa) return "en";
  if (!en) return "fa";
  return fa / (fa + en) >= 0.6 ? "fa" : "mixed";   // mixed => base LTR + isolated RTL spans
}

// Renders text with correct direction. Untrusted input: text only, never markup.
function jvBidi(text){
  const box = document.createElement("div");
  box.className = "jv-body";
  const kind = jvScript(text);
  if (kind === "fa"){ box.dir = "rtl"; box.classList.add("jv-fa"); box.textContent = text; return box; }
  box.dir = "ltr";
  if (kind === "en"){ box.textContent = text; return box; }
  let last = 0, m; FA_RUN.lastIndex = 0;
  while ((m = FA_RUN.exec(text)) !== null){
    if (m.index > last) box.appendChild(document.createTextNode(text.slice(last, m.index)));
    const sp = document.createElement("span");
    sp.dir = "rtl"; sp.className = "jv-fa"; sp.textContent = m[0];
    box.appendChild(sp);
    last = m.index + m[0].length;
  }
  if (last < text.length) box.appendChild(document.createTextNode(text.slice(last)));
  return box;
}

// ---- small DOM helpers -----------------------------------------------------
function jvNode(tag, text, cls){
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = (text === null || text === "") ? "—" : String(text);
  return n;
}
function jvWhen(v){
  if (v == null || v === "") return "—";
  const d = new Date(v);
  return isNaN(d.getTime()) ? String(v) : d.toLocaleString();
}
// jarvis_* RPCs do not exist yet, so accept either shape the codebase already
// uses: a TABLE-returning RPC (array) or a jsonb-returning one ({rows:[…]}).
function jvRows(d){
  if (Array.isArray(d)) return d;
  if (d && Array.isArray(d.rows)) return d.rows;
  return [];
}
// Turn a transport failure into something an owner can act on.
// Accepts an Error, a string, or the envelope's error OBJECT {code, message}. The last case is
// why this exists: the host helper in index.html does `throw new Error(d.error || ...)`, and the
// edge function's failure body sets `error: {code, message}` -- an object. `new Error({...})`
// stringifies to "[object Object]", so every unauthorized / forbidden / rate_limited / timeout
// response used to reach the founder as that literal text.
function jvErrText(e){
  if (!e) return "";
  if (typeof e === "string") return e;
  if (typeof e.code === "string" || typeof e.message === "string")
    return [e.code, e.message].filter(Boolean).join(": ");
  if (e instanceof Error){
    if (e.detail && typeof e.detail === "object") return jvErrText(e.detail);
    return e.message === "[object Object]" ? "unreadable error object" : e.message;
  }
  try { return JSON.stringify(e); } catch(_) { return String(e); }
}
function jvExplain(err){
  const m = jvErrText(err);
  if (/\b404\b|Could not find the function|NOT_FOUND|Failed to fetch|NetworkError/i.test(m))
    return S("unavailable") + m;
  if (/^unauthorized|missing bearer/i.test(m)) return "Your session expired. Sign in again.";
  if (/^forbidden|admin only/i.test(m))        return "You are not an admin on this account.";
  if (/^rate_limited/i.test(m))                return "Too many requests — wait a moment.";
  if (/^timeout/i.test(m))                     return "The tool timed out. No data was returned.";
  return m || "unknown error";
}

// Calls the edge function directly rather than the host `edge()` helper, so the {code,message}
// error object survives instead of being flattened into "[object Object]".
async function jvCall(tool, input){
  const res = await fetch(SUPABASE_URL + "/functions/v1/jarvis-tools", {
    method: "POST",
    headers: Object.assign({"Content-Type":"application/json"}, await authHeaders()),
    body: JSON.stringify({tool: tool, input: input || {}}),
  });
  let body = null;
  try { body = await res.json(); } catch(_) { throw new Error("HTTP " + res.status); }
  if (!res.ok || !body || body.ok !== true){
    const err = new Error(jvErrText(body && body.error) || ("HTTP " + res.status));
    err.detail = body && body.error;
    throw err;
  }
  return body;
}

// ---- chat mode (jarvis-tools v4) -------------------------------------------
// Posts {message, history}. The server owns tool selection now; the browser never names a tool.
// Same error-surfacing shape as jvCall so jvExplain() keeps working unchanged.
async function jvChatCall(text, history){
  const res = await fetch(SUPABASE_URL + "/functions/v1/jarvis-tools", {
    method: "POST",
    headers: Object.assign({"Content-Type":"application/json"}, await authHeaders()),
    body: JSON.stringify({message: text, history: history || []}),
  });
  let body = null;
  try { body = await res.json(); } catch(_) { throw new Error("HTTP " + res.status); }
  if (!res.ok || !body || body.ok !== true){
    const err = new Error(jvErrText(body && body.error) || ("HTTP " + res.status));
    err.detail = body && body.error;
    throw err;
  }
  return body;
}

// Prior turns for model context. ONLY real exchanges: "sys" bubbles are console-generated
// notices (errors, "no tool matched"), and replaying them as assistant turns would teach the
// model that refusing is its own past behaviour. Server caps at 20 turns / 8000 chars anyway.
function jvHistory(){
  return JV_TURNS
    .filter(t => t.role === "me" || t.role === "bot")
    .map(t => ({role: t.role === "me" ? "user" : "assistant", content: String(t.text || "")}))
    .filter(t => t.content.trim().length > 0);
}

// The envelope has NO `answer` key — it carries `data`. Render that, never invent prose.
// NAMED jvAnswerText, not jvRender: this fragment already declares jvRender() to mount the
// DOM template, and two function declarations with the same name silently clobber each other.
function jvAnswerText(env){
  const d = env && env.data;
  if (d === undefined || d === null) return S("noAnswer");
  if (typeof d === "string" || typeof d === "number" || typeof d === "boolean") return String(d);
  if (Array.isArray(d)) return d.length ? d.length + " row(s) — see Evidence" : "No rows.";
  const keys = Object.keys(d);
  if (!keys.length) return "Empty result.";
  return keys.slice(0, 12)
    .map(k => k + ": " + (typeof d[k] === "object" ? "…" : String(d[k])))
    .join("\n");
}

// ---- state -----------------------------------------------------------------
let JV_BUSY = false, JV_TASKS = null, JV_TASKS_ERR = null, JV_APPR = null, JV_APPR_ERR = null;
let JV_TURNS = [];   // [{role:"me"|"bot"|"sys", text, env}] — page session only, never stored
let JV_STRIP = {state:"idle", env:null, why:""};   // so a language switch can redraw it

// ---- transcript ------------------------------------------------------------
function jvBubble(turn){
  const wrap = document.createElement("div");
  wrap.className = "jv-msg " + (turn.role === "me" ? "jv-me" : turn.role === "sys" ? "jv-sys" : "jv-bot");
  wrap.appendChild(jvNode("div", turn.role === "me" ? S("you") : turn.role === "sys" ? S("sys") : S("bot"), "jv-who"));
  wrap.appendChild(jvBidi(turn.text));
  if (turn.env){
    const d = document.createElement("details"); d.className = "jv-ev";
    d.appendChild(jvNode("summary", S("evidence")));
    const pre = jvNode("pre", "", "jv-json");
    pre.textContent = JSON.stringify(turn.env, null, 2);   // raw envelope, verbatim
    d.appendChild(pre);
    wrap.appendChild(d);
  }
  return wrap;
}
function jvRenderLog(){
  const log = document.querySelector("#jvLog");
  if (!log) return;
  log.textContent = "";
  if (!JV_TURNS.length){ log.appendChild(jvNode("p", S("empty"), "jv-empty")); return; }
  JV_TURNS.forEach(t => log.appendChild(jvBubble(t)));
  log.scrollTop = log.scrollHeight;                        // newest last, auto-scroll
}
function jvPush(role, text, env){
  JV_TURNS.push({role:role, text:text, env:env || null});
  const log = document.querySelector("#jvLog");
  if (!log) return;
  if (JV_TURNS.length === 1) log.textContent = "";
  log.appendChild(jvBubble(JV_TURNS[JV_TURNS.length - 1]));
  log.scrollTop = log.scrollHeight;
}

// ---- tool-activity strip ---------------------------------------------------
// state: "idle" | "run" | "ok" | "err". We cannot name the tool before the
// response arrives (no streaming in Phase B), so "run" says so honestly.
// ---- chat rendering --------------------------------------------------------
// The <details> "Evidence" block in jvBubble() JSON-stringifies whatever it is handed. For a
// chat turn the useful payload is the tool envelopes plus provenance, NOT the chat wrapper —
// so hand it a purpose-built object. `evidence` holds the RAW, UNREDACTED tool envelopes; the
// model only ever saw a redacted copy of any privacy:"personal" result (constitution §5).
function jvChatEvidence(resp){
  if (!resp) return null;
  return {
    answered_by: resp.source,                 // "model:claude-sonnet-4-6"
    observed_at: resp.observed_at,
    environment: resp.environment,
    language: resp.language,
    tools_used: resp.tools_used || [],
    usage: resp.usage || null,
    degraded: resp.degraded || [],
    evidence: resp.evidence || [],            // array of raw tool envelopes
  };
}

// jvStrip() expects a tool Envelope (e.tool/e.source/e.observed_at). A chat response has no
// `tool`, so synthesise a label from tools_used — "✓ —" would otherwise imply nothing ran.
function jvStripChat(resp){
  const used = (resp && resp.tools_used) || [];
  jvStrip("ok", {
    tool: used.length ? used.join(", ") : "conversation (no tool)",
    source: resp && resp.source,
    observed_at: resp && resp.observed_at,
    environment: resp && resp.environment,
    degraded: (resp && resp.degraded) || [],
  });
}

function jvStrip(state, env, why){
  JV_STRIP = {state:state, env:env || null, why:why || ""};
  const strip = document.querySelector("#jvStrip");
  if (!strip) return;
  strip.className = "jv-strip is-" + state;
  const main = document.querySelector("#jvStripMain"), ev = document.querySelector("#jvStripEv");
  ev.textContent = "";
  if (state === "idle"){ main.textContent = S("stripIdle"); return; }
  if (state === "run"){  main.textContent = S("stripRun");  return; }
  if (state === "err"){  main.textContent = S("stripErr") + " · " + (why || ""); return; }
  // The envelope in docs/lovejan-ai-ops/21-jarvis-tool-contracts.md carries these at the TOP
  // level. An earlier revision read them from a nested `env.evidence` object that the contract
  // never defined, so the strip printed "source — · observed at — · environment —" while the
  // real values sat one level up.
  const e = env || {};
  main.textContent = "✓ " + (e.tool || "—");
  ev.textContent = S("lblSource") + " " + (e.source || "—")
                 + " · " + S("lblObserved") + " " + (e.observed_at || "—")
                 + " · " + S("lblEnv") + " " + (e.environment || "—")
                 + (Array.isArray(e.degraded) && e.degraded.length
                      ? " · ⚠ degraded: " + e.degraded.join(", ") : "");
}

// ---- send ------------------------------------------------------------------
async function jvSend(){
  const ta = document.querySelector("#jvInput"), btn = document.querySelector("#jvSend");
  const text = (ta.value || "").trim();
  if (!text || JV_BUSY) return;
  JV_BUSY = true; btn.disabled = true; ta.value = "";
  // Snapshot the transcript BEFORE this turn joins it. jvHistory() reads JV_TURNS, and this
  // message travels in `message`, not in `history` — building it after the push would send the
  // turn twice. Snapshotting rather than slicing the last entry off afterwards: it makes no
  // assumption about which element jvHistory() happens to keep last, so it stays correct if
  // that filter ever changes.
  const hist = jvHistory();
  jvPush("me", text, null);
  jvStrip("run");
  try{
    // v4 contract: {message, history}. Tool selection moved SERVER-SIDE — the model picks from
    // the frozen registry and the edge function executes through its one validated path. The
    // browser deliberately no longer guesses a tool from a regex; jvPickTool is gone (PATCH 4),
    // and it is never coming back as a "model unavailable" fallback: presenting a regex guess as
    // an assistant answer is the fabricated-answer failure this change exists to remove.
    // `hist` was built above, before jvPush("me", …), so it excludes the current turn.
    const resp = await jvChatCall(text, hist);                // never a direct table read
    jvPush("bot", resp.answer || S("noAnswer"), jvChatEvidence(resp));
    jvStripChat(resp);
  }catch(e){
    const why = jvExplain(e);
    jvPush("sys", why, null);                                // distinct bubble: not a Jarvis answer
    jvStrip("err", null, why);
  }finally{
    JV_BUSY = false; btn.disabled = false;
  }
}

// ---- side panels -----------------------------------------------------------
function jvRenderTasks(){
  const box = document.querySelector("#jvTasks");
  if (!box) return;
  box.textContent = "";
  if (JV_TASKS_ERR){ box.appendChild(jvNode("p", JV_TASKS_ERR, "jv-bad")); return; }
  if (!JV_TASKS){ box.appendChild(jvNode("p", "…", "jv-none")); return; }
  if (!JV_TASKS.length){ box.appendChild(jvNode("p", S("tasksNone"), "jv-none")); return; }
  const tbl = document.createElement("table");
  const hr = document.createElement("tr");
  ["thId","thStatus","thCreated","thLang"].forEach(k => hr.appendChild(jvNode("th", S(k))));
  const thead = document.createElement("thead"); thead.appendChild(hr); tbl.appendChild(thead);
  const tb = document.createElement("tbody");
  JV_TASKS.forEach(function(t){
    const tr = document.createElement("tr");
    const id = t.id == null ? "" : String(t.id);
    const idCell = jvNode("td", id ? id.slice(0, 8) : "—", "dim jv-mono");
    if (id) idCell.title = id;
    tr.appendChild(idCell);
    const st = document.createElement("td");
    st.appendChild(jvNode("span", t.status, "tag"));         // no colour: statuses are unspecified
    st.firstChild.style.background = "var(--panel3)";
    st.firstChild.style.color = "#c9c4d6";
    tr.appendChild(st);
    tr.appendChild(jvNode("td", jvWhen(t.created_at), "dim"));
    tr.appendChild(jvNode("td", t.language, "dim"));
    tb.appendChild(tr);
  });
  tbl.appendChild(tb); box.appendChild(tbl);
}

function jvRenderApprovals(){
  const box = document.querySelector("#jvApprovals");
  if (!box) return;
  box.textContent = "";
  if (JV_APPR_ERR){ box.appendChild(jvNode("p", JV_APPR_ERR, "jv-bad")); return; }
  if (!JV_APPR){ box.appendChild(jvNode("p", "…", "jv-none")); return; }
  if (!JV_APPR.length){ box.appendChild(jvNode("p", S("approvalsNone"), "jv-none")); return; }
  // The row shape is not specified anywhere yet, so this stays shape-agnostic:
  // show id/status when those keys happen to exist, and the whole row verbatim.
  JV_APPR.forEach(function(a, i){
    const d = document.createElement("details"); d.className = "jv-appr";
    const label = (a && a.id ? String(a.id) : "#" + (i + 1)) + (a && a.status ? " · " + a.status : "");
    d.appendChild(jvNode("summary", label));
    const pre = jvNode("pre", "", "jv-json");
    pre.textContent = JSON.stringify(a, null, 2);
    d.appendChild(pre);
    box.appendChild(d);
  });
}

async function jvLoadPanels(){
  JV_TASKS = null; JV_TASKS_ERR = null; JV_APPR = null; JV_APPR_ERR = null;
  jvRenderTasks(); jvRenderApprovals();
  const missing = [];
  await Promise.all([
    rpc(JV_RPC_TASK).then(function(d){ JV_TASKS = jvRows(d); })
      .catch(function(e){ JV_TASKS_ERR = jvExplain(e && e.message); missing.push(JV_RPC_TASK + "()"); }),
    rpc(JV_RPC_APPR).then(function(d){ JV_APPR = jvRows(d); })
      .catch(function(e){ JV_APPR_ERR = jvExplain(e && e.message); missing.push(JV_RPC_APPR + "()"); })
  ]);
  jvRenderTasks(); jvRenderApprovals();
  // If the RPCs are absent the edge function almost certainly is too — say it
  // once, at the top, instead of leaving three panels quietly empty.
  const banner = document.querySelector("#jvBanner");
  if (missing.length){
    document.querySelector("#jvBannerList").textContent =
      "missing: " + missing.join(", ") + ", edge function " + JV_FN + " — " + S("bannerTail");
    banner.classList.remove("hidden");
  }else{
    banner.classList.add("hidden");
  }
}

// ---- language --------------------------------------------------------------
function jvApplyLang(){
  const root = document.querySelector(".jv-root");
  if (!root) return;
  root.querySelectorAll("[data-jv-t]").forEach(function(n){
    const v = S(n.dataset.jvT);
    n.textContent = v;
    n.dir = jvScript(v) === "fa" ? "rtl" : "ltr";
  });
  root.querySelectorAll("[data-jv-p]").forEach(function(n){ n.placeholder = S(n.dataset.jvP); });
  root.querySelectorAll("[data-jv-ti]").forEach(function(n){ n.title = S(n.dataset.jvTi); });
  document.querySelector("#jvLangEn").classList.toggle("on", JV_LANG === "en");
  document.querySelector("#jvLangFa").classList.toggle("on", JV_LANG === "fa");
}
function jvSetLang(l){
  JV_LANG = l;
  try{ localStorage.setItem("lj_jarvis_lang", l); }catch(e){}
  jvApplyLang();                 // chrome strings only — message text is never touched
  jvRenderLog(); jvRenderTasks(); jvRenderApprovals();
  jvStrip(JV_STRIP.state, JV_STRIP.env, JV_STRIP.why);   // keep the last evidence line
}

// ---- mount + route registration -------------------------------------------
function jvRender(){
  const host = document.querySelector("#view");
  host.textContent = "";
  host.appendChild(document.querySelector("#jvTpl").content.cloneNode(true));
  jvApplyLang();
  jvStrip("idle");
  jvRenderLog();
  document.querySelector("#jvLangEn").onclick = function(){ jvSetLang("en"); };
  document.querySelector("#jvLangFa").onclick = function(){ jvSetLang("fa"); };
  document.querySelector("#jvSend").onclick = jvSend;
  document.querySelector("#jvInput").addEventListener("keydown", function(e){
    if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); jvSend(); }
  });
  document.querySelector("#jvInput").focus();
  jvLoadPanels();
}

// Register the view without touching index.html's `titles` literal or its
// route map by hand: both are reachable globals from this later script.
titles.jarvis = "Jarvis";
const jvHostRoute = route;
route = function(v){
  if (v !== "jarvis") return jvHostRoute(v);
  current = "jarvis";
  document.querySelectorAll("#nav a").forEach(function(a){
    a.classList.toggle("active", a.dataset.view === "jarvis");
  });
  document.querySelector("#title").textContent = titles.jarvis;
  jvRender();
};
})();
</script>
